services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    container_name: trustmedia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustmedia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmedia_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-trustmedia}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustmedia} -d ${POSTGRES_DB:-trustmedia}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    container_name: trustmedia-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
