[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmedia-ai-backend"
version = "0.1.0"
description = "Evidence-aware digital media research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.140,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.13,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.20,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5,<8",
  "pgvector>=0.3.0",
  "beautifulsoup4>=4.12.0",
  "pyjwt>=2.8.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "rank-bm25>=0.2.2",
  "scikit-learn>=1.4.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["httpx2>=2.13,<3.0", "pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
